<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Space+Grotesk:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB8FF}a:hover{color:#C3D3FF}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; overflow: hidden; position: relative; background: #0F1012; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 72px 20px 0; opacity: 0.25; display: flex; flex-direction: column; gap: 6px">
  <div style="font-size: 72px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">10:24</div>
  <div style="font-size: 15px; color: #9CA1A9">Thursday, 12 November</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,8,0.55)"></div>

<section aria-label="Add a widget" style="position: absolute; left: 0; right: 0; bottom: 0; top: 196px; border-radius: 30px 30px 0 0; background: #17191C; border-top: 1px solid #2A2E33; padding: 10px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3F46; align-self: center"></div>
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Add a widget</h1>
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1F2226; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
    </button>
  </div>
  <p style="margin: -8px 0 0; font-size: 13px; color: #9CA1A9">Tap a widget to drop it in the free-form area. You can move and resize it after.</p>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9CA1A9">Grid Launcher</span><span style="font-size: 12px; color: #80868F">8 widgets</span></div>
    <div style="display: flex; gap: 10px; overflow: hidden">
      <button style="flex: 1; min-width: 0; border: 1px solid #2A2E33; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer; font-family: 'Geist', system-ui, sans-serif">
        <div style="font-size: 36px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">10:24</div>
        <div style="display: flex; justify-content: space-between; width: 100%; font-size: 12px"><span>Clock &amp; date</span><span style="font-family: 'Geist Mono', monospace; color: #9CA1A9">4×2</span></div>
      </button>
      <button style="flex: 1; min-width: 0; border: 1px solid #9DB8FF; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer; font-family: 'Geist', system-ui, sans-serif">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">Work</div>
        <div style="display: flex; justify-content: space-between; width: 100%; font-size: 12px"><span>Text label</span><span style="font-family: 'Geist Mono', monospace; color: #9CA1A9">Any</span></div>
      </button>
      <button style="flex: 0 0 120px; min-width: 0; border: 1px solid #2A2E33; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer; font-family: 'Geist', system-ui, sans-serif">
        <div style="font-size: 20px; font-weight: 300; line-height: 1.2">Standup<br><span style="font-size: 11px; color: #9CA1A9">In 6 min</span></div>
        <div style="font-size: 12px">Up next</div>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9CA1A9">Weather</span><span style="font-size: 12px; color: #80868F">2 widgets</span></div>
    <div style="display: flex; gap: 10px">
      <button style="flex: 0 0 120px; border: 1px solid #2A2E33; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; cursor: pointer; font-family: 'Geist', system-ui, sans-serif">
        <div style="font-size: 26px; letter-spacing: -0.02em">14°</div>
        <div style="display: flex; justify-content: space-between; width: 100%; font-size: 12px"><span>Today</span><span style="font-family: 'Geist Mono', monospace; color: #9CA1A9">2×2</span></div>
      </button>
      <button style="flex: 1; min-width: 0; border: 1px solid #2A2E33; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; font-family: 'Geist', system-ui, sans-serif">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; width: 100%; font-family: 'Geist Mono', monospace; font-size: 12px; text-align: center">
          <span>Fri<br>15°</span><span>Sat<br>12°</span><span>Sun<br>11°</span><span>Mon<br>13°</span>
        </div>
        <div style="display: flex; justify-content: space-between; width: 100%; font-size: 12px"><span>Forecast</span><span style="font-family: 'Geist Mono', monospace; color: #9CA1A9">4×2</span></div>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9CA1A9">Calendar</span><span style="font-size: 12px; color: #80868F">1 widget</span></div>
    <button style="border: 1px solid #9DB8FF; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: 'Geist', system-ui, sans-serif; text-align: left">
      <div style="width: 4px; height: 36px; border-radius: 2px; background: #9DB8FF"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Up next</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9CA1A9">11:00 · Design review</span></div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9CA1A9">4×1</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9CA1A9">Music</span><span style="font-size: 12px; color: #80868F">1 widget</span></div>
    <button style="border: 1px solid #2A2E33; border-radius: 20px; background: #0F1012; color: #ECEDEF; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: 'Geist', system-ui, sans-serif; text-align: left">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #2A2E33"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Now playing</span><span style="font-size: 12px; color: #9CA1A9">Track · Artist</span></div>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#ECEDEF"><path d="M7 4l13 8-13 8z"></path></svg>
    </button>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
