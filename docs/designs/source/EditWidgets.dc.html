<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB8FF}a:hover{color:#C3D3FF}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; overflow: hidden; position: relative; background: #0F1012; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif">

<header style="height: 64px; padding: 16px 16px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 16px; font-weight: 600">Edit Screen 1 of 3</span>
    <span style="font-size: 12px; color: #9CA1A9">Drag to move · Pull corners to resize · Swipe for screens</span>
  </div>
  <div style="display: flex; gap: 10px; align-items: center"><span aria-label="Undo" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #3A3F46; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L4 10l5 5 M4 10h10a5 5 0 0 1 0 10h-3"></path></svg></span>
  <button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: #9DB8FF; color: #0F1012; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Done</button></div>
</header>

<section aria-label="Widget area" style="position: relative; height: 300px; margin: 8px 12px 0; border-radius: 24px; border: 1px dashed #3A3F46; background-color: #121417; background-image: radial-gradient(#2E333A 1px, transparent 1.2px); background-size: 16px 16px">

  <div style="position: absolute; left: 16px; top: 16px; width: 226px; height: 104px; box-sizing: border-box; border-radius: 18px; border: 1px solid #3A3F46; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(15,16,18,0.6)">
    <div style="font-size: 60px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">10:24</div>
    <div style="font-size: 13px; color: #9CA1A9">Thursday, 12 November</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 16px; height: 0; border-top: 1px dashed #9DB8FF; opacity: 0.7"></div>

  <div style="position: absolute; right: 16px; top: 16px; width: 140px; height: 140px; box-sizing: border-box; border-radius: 28px; background: #17191C; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; outline: 2px solid #9DB8FF; outline-offset: 3px">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 18z"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 32px; letter-spacing: -0.02em">14°</div>
      <div style="font-size: 12px; color: #9CA1A9">Cloudy · 16° / 9°</div>
    </div>
    <span style="position: absolute; left: -9px; top: -9px; width: 12px; height: 12px; border-radius: 6px; background: #0F1012; border: 2px solid #9DB8FF"></span>
    <span style="position: absolute; right: -9px; top: -9px; width: 12px; height: 12px; border-radius: 6px; background: #0F1012; border: 2px solid #9DB8FF"></span>
    <span style="position: absolute; left: -9px; bottom: -9px; width: 12px; height: 12px; border-radius: 6px; background: #0F1012; border: 2px solid #9DB8FF"></span>
    <span style="position: absolute; right: -9px; bottom: -9px; width: 12px; height: 12px; border-radius: 6px; background: #0F1012; border: 2px solid #9DB8FF"></span>
  </div>
  <div style="position: absolute; right: 44px; top: 170px; height: 24px; padding: 0 10px; border-radius: 12px; background: #9DB8FF; color: #0F1012; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; display: flex; align-items: center">140 × 140 dp</div>

  <div style="position: absolute; left: 16px; top: 144px; width: 226px; height: 72px; box-sizing: border-box; border-radius: 22px; background: #17191C; border: 1px solid #3A3F46; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <div style="width: 4px; align-self: stretch; border-radius: 2px; background: #9DB8FF"></div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; font-weight: 500">Design review</div>
      <div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9CA1A9">11:00 · in 36 min</div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 232px; width: 120px; height: 52px; box-sizing: border-box; border-radius: 18px; background: #17191C; border: 1px solid #3A3F46; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9CA1A9"><span>Battery</span><span style="font-family: 'Geist Mono', monospace; color: #ECEDEF">82%</span></div>
    <div style="height: 6px; border-radius: 3px; background: #2A2E33"><div style="width: 82%; height: 6px; border-radius: 3px; background: #9DB8FF"></div></div>
  </div>
</section>

<div style="margin: 10px 16px 0; display: flex; gap: 8px; justify-content: center">
  <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #2A2E33; background: #17191C; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="2" stroke-linecap="round"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13"></path></svg>Remove
  </button>
  <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #2A2E33; background: #17191C; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="2" stroke-linecap="round"><path d="M4 4h7v7H4z M13 13h7v7h-7z"></path></svg>Bring to front
  </button>
</div>

<section aria-label="Apps (locked while editing)" style="margin-top: 22px; opacity: 0.32; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 8px; padding: 0 12px; align-items: start">
  <sc-for list="{{apps}}" as="app" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div style="width: 60px; height: 60px; border-radius: 20px; background: #1F2226; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{app.d}}"></path></svg>
      </div>
      <span style="font-size: 13px; font-weight: 500">{{app.name}}</span>
      <div style="height: 34px; width: 100%; box-sizing: border-box; border-radius: 17px; border: 1px solid #2A2E33"></div>
    </div>
  </sc-for>
</section>

<nav aria-label="Edit tools" style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 72px; border-radius: 26px; background: #1B1E22; border: 1px solid #2A2E33; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
  <button style="border: 0; background: transparent; color: #9DB8FF; font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB8FF" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M16.5 13v7 M13 16.5h7"></path></svg>Add widget
  </button>
  <button style="border: 0; background: transparent; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16H7z M3 7v10 M21 7v10"></path></svg>Screen
  </button>
  <button style="border: 0; background: transparent; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4"></path></svg>Wallpaper
  </button>
  <button style="border: 0; background: transparent; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M20 18h0 M16 4v4 M10 10v4 M18 16v4"></path></svg>Settings
  </button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      apps: [
        { name: 'Browser', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z' },
        { name: 'Calculator', d: 'M6 3h12v18H6z M9 7h6 M9 12h.01 M12 12h.01 M15 12h.01 M9 16h.01 M12 16h.01 M15 16h.01' },
        { name: 'Calendar', d: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4' },
        { name: 'Camera', d: 'M4 8h3l2-3h6l2 3h3v11H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
        { name: 'Clock', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2' },
        { name: 'Contacts', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0' }
      ]
    };
  }
}
</script>
</body>
</html>
