<html lang="en">
<head>
<meta charset="utf-8">
<title>Text label editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;family=Lora:wght@400&amp;family=Inter:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB8FF}a:hover{color:#C3D3FF}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; overflow: hidden; position: relative; background: #0F1012; color: #ECEDEF; font-family: 'Geist', system-ui, sans-serif;">

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,8,0.55)"></div>
<section aria-label="Text label" style="position: absolute; left: 0; right: 0; top: 70px; bottom: 0; border-radius: 30px 30px 0 0; background: #17191C; border-top: 1px solid #2A2E33; padding: 10px 0 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3F46; align-self: center"></div>
  <div style="display: flex; align-items: center; padding: 0 16px"><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Text label</h1><span style="padding: 10px 12px; color: #9CA1A9; font-size: 14px">Cancel</span><span style="padding: 10px 12px; color: #9DB8FF; font-size: 14px; font-weight: 600">Save</span></div>
  <div style="margin: 0 16px; height: 96px; border-radius: 20px; background: #0F1012; padding: 0 16px; display: flex; align-items: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.02em; line-height: 1">Work</div>
  <div style="margin: 0 16px; height: 56px; border-radius: 16px; border: 2px solid #9DB8FF; padding: 0 14px; display: flex; align-items: center; position: relative; font-size: 16px">Work<span style="position: absolute; left: 12px; top: -9px; background: #17191C; padding: 0 4px; font-size: 12px; color: #9DB8FF">Text</span></div>
  <div style="padding: 0 16px; font-size: 15px">Font</div>
  <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden"><span role="radio" aria-checked="false" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; white-space: nowrap; font-size: 15px; font-family: 'Geist', system-ui, sans-serif; border: 1px solid #2A2E33; color: #ECEDEF">App font</span><span role="radio" aria-checked="true" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; white-space: nowrap; font-size: 15px; font-family: 'Space Grotesk', sans-serif; background: #9DB8FF; color: #0F1012">Space Grotesk</span><span role="radio" aria-checked="false" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; white-space: nowrap; font-size: 15px; font-family: 'Inter', sans-serif; border: 1px solid #2A2E33; color: #ECEDEF">Inter</span><span role="radio" aria-checked="false" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; white-space: nowrap; font-size: 15px; font-family: 'Lora', serif; border: 1px solid #2A2E33; color: #ECEDEF">Lora</span><span role="radio" aria-checked="false" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; white-space: nowrap; font-size: 15px; font-family: 'Geist', system-ui, sans-serif; border: 1px solid #2A2E33; color: #ECEDEF">Geist</span></div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 15px">Weight</div><div role="radiogroup" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #0F1012"><button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD3; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400">Light</button><button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD3; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400">Regular</button><button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD3; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400">Medium</button><button role="radio" aria-checked="true" style="height: 40px; border: 0; border-radius: 12px; background: #9DB8FF; color: #0F1012; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 600">Bold</button></div></div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 15px">Alignment</div><div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #0F1012"><button role="radio" aria-checked="true" style="height: 40px; border: 0; border-radius: 12px; background: #9DB8FF; color: #0F1012; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 600">Left</button><button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD3; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400">Center</button><button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD3; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400">Right</button></div></div>
  <div style="padding: 0 16px; font-size: 15px">Color</div>
  <div style="display: flex; gap: 12px; padding: 0 16px"><span role="radio" aria-label="White" aria-checked="true" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 3px solid #9DB8FF; padding: 8px; display: flex"><span style="flex: 1; border-radius: 50%; background: #ECEDEF"></span></span><span role="radio" aria-label="Grey" aria-checked="false" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #2A2E33; padding: 8px; display: flex"><span style="flex: 1; border-radius: 50%; background: #9CA1A9"></span></span><span role="radio" aria-label="Blue" aria-checked="false" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #2A2E33; padding: 8px; display: flex"><span style="flex: 1; border-radius: 50%; background: #9DB8FF"></span></span></div>
</section>
</div>
</x-dc>
